# ============================================================================
#  GatE-V Training Configuration — DVCon India 2026 Design Contest Stage 2
# ============================================================================
# All hyperparameters in one place. Override via CLI:
#   python scripts/train.py --config configs/vega_base.yaml \
#       --override training.batch_size=4 training.stage1.epochs=6

model:
  backbone: r50vd
  num_classes: 1                    # Binary: preferred / not-preferred
  num_tasks: 14
  hidden_dim: 256
  num_queries: 200
  num_encoder_layers: 1
  num_decoder_layers: 6
  eval_idx: -1                     # MUST be the last layer because we removed DETR's deep supervision loop!
  task_embed_dim: 128
  fgtq_layers: [P3, P4, P5]        # Task-condition all backbone levels
  clip_model: ViT-B/32
  clip_proj_method: gaussian        # Johnson-Lindenstrauss projection
  use_fpga_discrete_sampling: true  # Discrete grid sampling for FPGA alignment
  cross_attn_method: discrete       # Default: FPGA-aligned discrete sampling
  use_learnable_residuals: true     # Learnable residual on top of CLIP embeddings
  inject_task_every_layer: true     # Task bias at every decoder layer

training:
  stage1:
    epochs: 15
    frozen_modules: [backbone]
    loss_weights:
      cls: 2.0
      l1: 5.0
      giou: 2.0
    task_loss_weight: 0.0
    lambda_noobj: 2.0               # start gentle
    lambda_exists: 2.0              # Moderate existence penalty
    lambda_noobj_ramp_epoch: 5      # ramp up to max after epoch 5
    lambda_noobj_max: 10.0

  stage2:
    epochs: 40                     # Extended 24→36 for higher mAP ceiling
    loss_weights:
      cls: 2.0
      l1: 5.0
      giou: 2.0
      task: 1.5
    task_loss_warmup_epochs: 6
    task_loss_warmup_start: 0.1
    lambda_noobj: 10.0
    lambda_exists: 2.0
    lambda_noobj_ramp_epoch: 10
    lambda_noobj_max: 12.0

  batch_size: 16                    # 4060M: 8GB VRAM
  img_size: 640                     # Full resolution
  grad_accum_steps: 8               # Effective batch = 8 × 4 = 32
  amp: true                         # Non-negotiable for 8GB
  base_lr: 1.0e-4
  backbone_lr: 1.0e-5
  weight_decay: 1.0e-4
  max_grad_norm: 0.1
  lr_scheduler: cosine
  lr_warmup_epochs: 3
  use_ema: true
  ema_decay: 0.999
  use_compile: true                # torch.compile() opt-in

validation:
  stage1_frequency: 1               # Validate every epoch
  stage2_frequency: 1               # Validate every epoch
  early_stopping_patience: 20       # More patience for longer stage2
  early_stopping_metric: map_0.5
  eval_idx: -1                       # Last decoder layer
  max_samples_per_task: 200          # Larger subset for stable checkpoint selection

data:
  coco_root: ./data/coco
  dataset_dir: ./data/coco-tasks-dataset
  images_dir: ./data/images_640
  num_workers: 4
  pin_memory: true
  cache_images: false                # Disable RAM caching by default
  task_aware_sampling: true          # Task-first sampling strategy
  augmentations:
    hsv:
      h: 0.015
      s: 0.7
      v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 0.0                      # Task-safe mosaic (disabled by default)
    mixup: 0.0                       # Task-safe mixup (disabled by default)

experiment:
  name: vega_base
  output_dir: ./runs
  seed: 42
  log_interval: 50
  checkpoint_save_top_k: 3

# Paths to pre-computed artifacts
precomputed:
  clip_embeddings: null              # Path to task_embeddings.pt (null = compute at runtime)
  pretrained_checkpoint: null        # Path to RT-DETRv2 checkpoint (null = auto-download)
